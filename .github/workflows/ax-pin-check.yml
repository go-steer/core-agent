name: ax-pin-check

# Weekly + on-demand check of examples/deploy/ax's pinned AX runner
# commits (.ax-ref on google/ax and .ax-fork-ref on mastersingh24/ax).
#
# Diffs google/ax main against .ax-ref for changes under docs/runner.md,
# the task-spec schema (pkg/apis/) and cmd/ax-task-runner, and diffs the
# fork against .ax-fork-ref and .ax-ref. Opens or updates one rolling
# issue rather than failing CI (#1410).

on:
  schedule:
    # Wednesdays at 06:41 UTC, off minute 0 to avoid GHA's scheduling spike.
    - cron: '41 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: 'chore(examples/deploy/ax): AX runner pin drift report'
  # The rolling issue is found by this label, not by title search: the
  # search index is eventually consistent and a maintainer may rename the
  # issue, either of which would make a title search open a duplicate
  # (#1418). The body also carries the ax-pin-check-rolling-issue marker
  # as a secondary check.
  ISSUE_LABEL: ax-pin-check
  BODY_FILE: ax-pin-issue-body.md

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-toolchain

      - name: Detect AX pin drift
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verdict="$(go run ./dev/ax-pin-check \
            --summary="${GITHUB_STEP_SUMMARY}" \
            --issue-body="${RUNNER_TEMP}/${BODY_FILE}")"
          case "$verdict" in
            drift=true|drift=false) echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected ax-pin-check output: ${verdict}"; exit 1 ;;
          esac

      - name: Open or update rolling issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: --force updates the label if it already exists.
          gh label create "${ISSUE_LABEL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Rolling AX runner pin drift report (ax-pin-check workflow)" \
            --color C5DEF5 \
            --force
          # Oldest open issue carrying the label and the body marker. A
          # label query is a direct lookup, not a search-index query.
          existing="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --limit 20 \
            --json number,body \
            --jq '[.[] | select((.body // "") | contains("<!-- ax-pin-check-rolling-issue -->"))] | sort_by(.number) | .[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/${BODY_FILE}"
            echo "Updated rolling issue #${existing}"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${ISSUE_TITLE}" \
              --label "${ISSUE_LABEL}" \
              --body-file "${RUNNER_TEMP}/${BODY_FILE}"
          fi
