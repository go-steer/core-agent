# Nightly judge-tier evaluation board (#1403, docs/mast-fold-design.md §3.8).
#
# Runs the 31-scenario LangChain SRE corpus and J-cost-tier against a live
# model via the harness in internal/evals/cmd/evals (--tier=judge).
#
# Credential-gated via keyless Workload Identity Federation using the same
# repository secrets and variables as e2e-real-provider.yml. When WIF
# secrets are absent (for example on a fork), the job skips cleanly rather
# than failing with a missing-credentials exit code.

name: Evals nightly

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model under test (empty uses the judge default)'
        required: false
        default: ''
      grader:
        description: 'Grader model for response_quality (empty uses the small default)'
        required: false
        default: ''
      provider:
        description: 'Provider override (gemini, vertex, anthropic, anthropic-vertex)'
        required: false
        default: ''
      rows:
        description: 'Optional comma-separated scenario IDs to run'
        required: false
        default: ''
  schedule:
    - cron: '43 5 * * *' # Daily 05:43 UTC — off the :00 stampede

permissions:
  contents: read
  id-token: write

jobs:
  judge:
    name: judge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_WIF: ${{ secrets.CORE_AGENT_E2E_WIF_PROVIDER != '' && secrets.CORE_AGENT_E2E_SERVICE_ACCOUNT != '' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_GENAI_USE_VERTEXAI: 'true'
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID }}
      CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION }}
      EVALS_MODEL: ${{ inputs.model }}
      EVALS_GRADER: ${{ inputs.grader }}
      EVALS_PROVIDER: ${{ inputs.provider }}
      EVALS_ROWS: ${{ inputs.rows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/go-toolchain

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.HAS_WIF == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.CORE_AGENT_E2E_WIF_PROVIDER }}
          service_account: ${{ secrets.CORE_AGENT_E2E_SERVICE_ACCOUNT }}

      - name: Skip when no credentials are configured
        if: env.HAS_WIF != 'true'
        run: |
          echo "evals-nightly: SKIP — no WIF credentials configured" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Run judge tier
        if: env.HAS_WIF == 'true'
        run: |
          set -euo pipefail
          args=(--tier=judge --out="${RUNNER_TEMP}/evals-board.json")
          if [[ -n "${EVALS_MODEL}" ]]; then
            args+=(--model="${EVALS_MODEL}")
          fi
          if [[ -n "${EVALS_GRADER}" ]]; then
            args+=(--grader="${EVALS_GRADER}")
          fi
          if [[ -n "${EVALS_PROVIDER}" ]]; then
            args+=(--provider="${EVALS_PROVIDER}")
          fi
          if [[ -n "${EVALS_ROWS}" ]]; then
            args+=(--rows="${EVALS_ROWS}")
          fi
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          go run ./internal/evals/cmd/evals "${args[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.HAS_WIF == 'true' && always()
        with:
          name: evals-judge-board
          path: ${{ runner.temp }}/evals-board.json
          retention-days: 30
          if-no-files-found: ignore
