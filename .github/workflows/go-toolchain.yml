name: Go toolchain

# Every place that names a Go version agrees with go.mod's `toolchain`
# directive. Its own workflow, with no `paths` filter, for two reasons:
#
#   1. ci.yml's `paths-ignore` skips `Dockerfile` and
#      `release*.yml` — precisely the files this check exists to
#      police. Living there, it would never see the change that
#      breaks it.
#   2. An allowlist `paths:` filter would leave the check "skipped"
#      on unrelated PRs, and a skipped required check blocks a merge
#      forever (same trap `version-fallback.yml` documents).
#
# It's grep against three files — cheap enough to run unconditionally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchain:
    name: go toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain pinning
        run: dev/ci/presubmits/verify-go-toolchain
