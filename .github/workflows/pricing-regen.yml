name: pricing-regen

# Weekly + on-demand refresh of pkg/pricing/builtin.go from
# LiteLLM's catalog. Opens an auto-PR when the regenerated file differs
# from what's in main. Fixed branch name (bot/pricing-regen) so re-runs
# update the existing PR rather than stacking dupes.
#
# Motivation: issue #259. The builtin table drifted silently between
# hand-authored revisions and shipped rates 20-30x off during the
# v2.7.0-dev.3 demo drive. This workflow guarantees at least one
# regen attempt per week without a human remembering.
#
# The generator lives in dev/regen-builtin-pricing/. Membership is a
# RULE, not a list — every chat-mode, tool-calling, priced, non-deprecated
# Gemini/Anthropic model in the catalog ships built-in — so a regen can
# add or remove models on its own, not just move rates. Adjust eligible()
# there to change what qualifies.

on:
  schedule:
    # Mondays at 09:00 UTC — off-hour, well before US working day.
    # Cron minute is 7 (not 0) to avoid the schedule-hour thundering
    # herd against GHA's minute-0 spike.
    - cron: '7 9 * * 1'
  workflow_dispatch:

# GITHUB_TOKEN is now only used to check the repo out — the branch push
# and the PR both go through the go-steer-bot App token minted below,
# which carries its own contents+pull-requests write. Leaving the write
# grants here would be a standing permission nothing in this job spends.
permissions:
  contents: read

env:
  BRANCH: bot/pricing-regen

jobs:
  regen:
    name: regen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-toolchain

      # Short-circuit if nothing generated moved — rates, context
      # windows, or the set of models that qualifies. LiteLLM's catalog
      # shifts slowly; most weeks this workflow exits here.
      #
      # This used to regenerate first and then test `git diff --quiet`.
      # That was really a test of the calendar, not of pricing: the
      # generator stamps time.Now() onto every entry, so the file
      # differs on any day it wasn't regenerated even when not a single
      # rate changed. Left alone it would have opened a no-op
      # date-churn PR every Monday forever.
      #
      # --check writes nothing and answers on stdout. Drift is NOT
      # signalled by exit status: `go run` collapses every non-zero
      # child status to 1, so a failed LiteLLM fetch would otherwise be
      # indistinguishable from a real price change. Any non-zero exit
      # here means the generator broke, and `set -e` fails the step.
      - name: Detect catalog drift
        id: drift
        run: |
          set -euo pipefail
          verdict="$(go run ./dev/regen-builtin-pricing --check)"
          case "$verdict" in
            drift=true|drift=false) echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected --check output: ${verdict}"; exit 1 ;;
          esac

      - name: Regenerate builtin.go from LiteLLM
        if: steps.drift.outputs.drift == 'true'
        run: go run ./dev/regen-builtin-pricing

      # Pre-validate the regenerated file. If lint/tests fail on the
      # new output, we'd rather fail the workflow than open a bad PR.
      # Reviewer then sees the alert and either fixes the generator or
      # tightens eligible().
      #
      # This is load-bearing now that membership is a rule: a model that
      # newly qualifies arrives with no pkg/modeltier tier and no
      # pkg/usage window fallback, and pricing's
      # TestBuiltinModelsKnownToCompanionTables fails here rather than
      # letting an unclassified model reach the /model picker (which
      # derives from this table) with its compaction threshold
      # defaulting to the universal 0.85.
      - name: Verify regen (lint + unit tests)
        if: steps.drift.outputs.drift == 'true'
        run: |
          bash dev/ci/presubmits/lint-go
          bash dev/ci/presubmits/test-unit

      - name: Extract regen date for PR body
        if: steps.drift.outputs.drift == 'true'
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Authenticate as the go-steer-bot GitHub App rather than with
      # GITHUB_TOKEN. Two independent reasons, both fatal:
      #
      #   1. The go-steer org forbids GITHUB_TOKEN from creating pull
      #      requests, and a repo can't override an org-level denial.
      #      This is what broke the 2026-08-10 run.
      #   2. Pushes made with GITHUB_TOKEN never trigger workflow runs
      #      (GitHub's loop guard). main requires 7 status checks, so a
      #      GITHUB_TOKEN-authored PR would sit unmergeable forever
      #      with every check stuck at "Expected".
      #
      # An App installation token is a distinct identity subject to
      # neither restriction, and it expires in ~1h so nothing
      # long-lived sits in the job. Keep the app-id/private-key as
      # ORG-level secrets — other go-steer repos share this app.
      #
      # Deliberately NOT gated on drift. Most weeks there is none, so
      # gating it would leave the credentials unexercised until the one
      # run that actually needs them — and a rotated-out private key or
      # an app uninstalled from this repo would surface as a failure on
      # the day there is finally something to ship. Minting on every run
      # makes the weekly job a live credential check; the token costs
      # nothing and expires in ~1h whether or not it gets used.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GOSTEER_BOT_APP_ID }}
          private-key: ${{ secrets.GOSTEER_BOT_PRIVATE_KEY }}

      # peter-evans/create-pull-request handles the branch/push/PR
      # lifecycle idempotently: if BRANCH already exists as an open
      # PR, it force-updates the branch and the PR head refreshes;
      # if no diff, it does nothing.
      #
      # NB: the PR author is go-steer-bot[bot], which review-gate.yml
      # exempts by name. Renaming the app means updating that
      # allowlist too, or the gate hard-fails on this PR.
      - name: Open / update auto-PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: main
          commit-message: |
            chore(pricing): regenerate builtin.go from LiteLLM (${{ steps.meta.outputs.date }})

            Automated regeneration by .github/workflows/pricing-regen.yml.
            Membership is a rule — adjust eligible() in
            dev/regen-builtin-pricing/main.go.
          title: 'chore(pricing): regenerate builtin.go from LiteLLM (${{ steps.meta.outputs.date }})'
          body: |
            Automated pricing regen — LiteLLM's `model_prices_and_context_window.json` shifted since the last time `pkg/pricing/builtin.go` was regenerated.

            **Regen date**: ${{ steps.meta.outputs.date }}
            **Source**: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
            **Membership rule**: `eligible()` in `dev/regen-builtin-pricing/main.go` (edit + re-run to change what qualifies)

            ## Review checklist

            - [ ] **New and removed models are intentional.** Membership is a rule, not a list, so this diff can add or drop whole models — not just move numbers. For each added key: is it a real GA/preview id an operator would plausibly pin, or catalog noise that `eligible()` should be excluding? For each removed key: upstream deprecated it or pulled it, and nothing in-tree still names it (`git grep` the id — task-class defaults, recipes, docs and UAT scripts all hardcode model ids). Adding a model also puts it in front of operators: the `/model` picker derives from this table, and shows anything at or above its per-family generation cutoff (`pickerEligible` in `cmd/core-agent/coretui_enabled.go`).
            - [ ] Diff on `pkg/pricing/builtin.go` is confined to the two generated maps (no spurious formatting churn)
            - [ ] Any rate change that halves or doubles is real (spot-check the provider's public pricing page — LiteLLM has occasionally shipped bad entries)
            - [ ] Context-window changes in `builtinContextWindows` are real. These drive compaction thresholds: a window that grows makes compaction fire later, and an over-large one lets a session run past a cap the provider hard-fails on.
            - [ ] `UpdatedAt` dates on all entries are today
            - [ ] The workflow log's rejection report ("N Gemini/Anthropic entries rejected") lists nothing that should have been kept — a model can vanish from this table because upstream stopped publishing its price or window, not only because it was deprecated

            ## Verification

            Presubmits (lint-go, test-unit) already ran green in this workflow before the PR opened. Full CI runs on push here.

            ## Manual regen

            ```
            go run ./dev/regen-builtin-pricing
            ```

            Context: this workflow is the automation half of #259 Slice B. Hand-authored builtin rates drifted 20-30x silently before we added the generator + weekly PR.
          labels: |
            pricing
            automated
          delete-branch: false
