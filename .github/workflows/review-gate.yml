# review-gate: PRs that touch Go code must carry an "Adversarial
# review" section in their body — the record that the skeptic pass
# from AGENTS.md "How we develop" actually ran (findings fixed/pinned;
# for bug fixes, the regression test verified to FAIL on pre-fix
# code). Docs-only PRs are exempt. This is the tool-agnostic backstop
# behind the .claude/settings.json PreToolUse hook: it catches PRs
# from any client, and edits that strip the section re-fail on the
# `edited` trigger.
name: review-gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    # Bot exemption (adversarial-review finding): pricing-regen opens
    # weekly automated PRs that touch pkg/pricing/builtin.go; once
    # review-gate is a required check, an unexempted bot PR would sit
    # at "Expected" forever. A skipped job satisfies branch
    # protection, so bot PRs merge normally.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Require adversarial-review section on Go-touching PRs
        env:
          # Body via env, never interpolated into the script — PR
          # bodies are attacker-controlled on public repos.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if ! grep -qE '\.go$' <<<"$files"; then
            echo "No Go changes — review gate not required."
            exit 0
          fi
          if grep -qi 'adversarial review' <<<"${PR_BODY:-}"; then
            echo "Adversarial-review section present."
            exit 0
          fi
          echo '::error::This PR touches Go code but its body has no "Adversarial review" section. Run the skeptic pass per AGENTS.md "How we develop" (fix/pin findings; for bug fixes verify the regression test FAILS on pre-fix code) and record the outcome in the PR body.'
          exit 1
