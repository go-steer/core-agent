# golangci-lint v2 config for core-agent.
#
# Conservative set: keeps the noise low while catching real bugs. Add
# stricter linters (revive, depguard, exhaustruct, etc.) once the
# baseline is clean and we have a feel for what's worth enforcing.
#
# Two of the enabled linters — funlen and gocognit — are a *ratchet*
# rather than a standard, and their thresholds are meant to be lowered
# over time and never raised. See the "Complexity ratchet" block under
# `linters.settings` before touching them.
#
# Run with:   dev/tools/lint-go
# Auto-fix:   dev/tools/lint-go --fix

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Bug-finders we never want to silence.
    - errcheck       # unchecked errors
    - govet          # core vet rules
    - ineffassign    # ineffectual assignments
    - staticcheck    # massive bug+style ruleset (now includes stylecheck + gosimple)
    - unused         # dead code

    # Quality-of-life.
    - misspell       # common typos in identifiers/comments
    - unconvert      # unnecessary type conversions
    - unparam        # unused function parameters
    - gocritic       # opinionated extra rules; many useful, low false-positive

    # Compliance.
    - goheader       # enforces the Apache 2.0 boilerplate on every .go file

    # Security.
    - gosec          # OWASP-style checks (nosec via // #nosec)

    # Complexity ratchet (#662). These are NOT a style standard — the
    # thresholds are pinned to today's worst in-tree function, so
    # existing code passes untouched and only something *worse* than
    # anything we have now can land. See `settings.funlen` below for
    # the measured numbers and how to re-measure.
    - funlen         # function length: physical lines + statement count
    - gocognit       # cognitive complexity (nesting-weighted, not gocyclo)

  exclusions:
    # Generated code shouldn't fail the lint.
    generated: lax
    presets:
      - common-false-positives
      - legacy
    rules:
      # Tests can be looser about errcheck (eg. defer f.Close()) and
      # have permission to use weak random / hardcoded creds.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      # The MCP SDK exposes some types we deliberately don't fully use;
      # silence "always returns nil" style noise inside our wrapper.
      - path: mcp/
        text: "(unparam|S1009)"
      # The one complexity-ratchet exemption, and the reason the
      # thresholds below can be as tight as they are: cmd/core-agent's
      # `run` is a 1228-line / 642-statement / 374-cognitive-complexity
      # outlier — 5x worse than the next function in the tree on every
      # metric. Pinning the thresholds above IT would leave a fence at
      # 1229 lines, which forbids nothing anyone would ever write by
      # accident. So `run` is named here, once, next to the numbers it
      # distorts, and everything else gets a fence that actually holds.
      #
      # Deliberately narrower than a per-file exclusion: this matches
      # the single function, so a *new* god-method elsewhere in
      # main.go still fails. Delete this rule when #685 decomposes
      # `run`; the thresholds below drop with it.
      - path: cmd/core-agent/main\.go
        text: "(Function 'run'|of func `run`)"
        linters:
          - funlen
          - gocognit
      # Lifted from go-steer/cogo per docs/embedded-tui-design-v2.md
      # (PR 1 + parity amend). The cogo attribution is preserved as
      # explicit provenance — both projects are go-steer org with the
      # same Apache-2 license; the lift is honest about its source
      # rather than relicensing on arrival. Covers:
      #   internal/tui/                           — the TUI proper
      #   internal/testutil/fake_model.go         — test helper
      #   permissions/verb.go + verb_test.go      — verb extraction
      #   permissions/builtin_allow.go + test     — bundle catalog
      # Remove this exclusion when path C (cogo flips to depend on
      # core-agent's TUI) lands and the extracted package gets
      # re-headered.
      - path: (internal/tui|internal/testutil)/
        linters:
          - goheader
      - path: permissions/(verb|builtin_allow)(_test)?\.go
        linters:
          - goheader

  settings:
    errcheck:
      # Noise patterns where checking the error has no useful action:
      # writing to stderr for a diagnostic, closing a file in defer,
      # or best-effort cleanup of a temp file. The `_ =` boilerplate
      # is worse than the missed check here.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - os.Remove
    # --- Complexity ratchet (#662) ----------------------------------
    #
    # A ratchet, not a standard. Every threshold is the *measured
    # maximum in the tree on the day it was set*, so the whole existing
    # codebase passes with zero changes and the only thing that can
    # fail is a function worse than anything we already have. Length is
    # not itself a defect; unbounded growth is.
    #
    # Measured 2026-08-13 at commit 4ac5efb, excluding cmd/core-agent's
    # `run` (see the exclusion rule above):
    #
    #   funlen lines       254   dev/uat/scheduled-monitor `run`,
    #                            pkg/agent/autonomous/resume.go `Resume`
    #   funlen statements  145   pkg/agent/autonomous/resume.go `Resume`
    #   gocognit           110   internal/coretuiremote `(*Adapter).Events`
    #
    # Ratchet DOWN as hotspots get refactored — never up. #659 lands
    # the next notch (it decomposes Agent.Run's pre-turn pipeline and
    # its acceptance criteria include lowering these). #685 removes
    # the `run` exemption, which should take these to roughly
    # 155 / 95 / 96.
    #
    # To re-measure: set lines/statements/min-complexity to 1, run
    # `dev/tools/lint-go`, and take the max reported value per metric.
    # Two gotchas, both of which will silently under-report:
    #   - funlen reports *either* the line or the statement violation
    #     per function, not both, so measure them in separate runs with
    #     the other limit set very high.
    #   - `issues.uniq-by-line` (on by default) keeps one issue per
    #     source line, so a funlen finding is dropped whenever gocognit
    #     or `unused` already fired on the same declaration. Set it
    #     false while measuring.
    funlen:
      lines: 254
      statements: 145
      # Comment lines don't count toward the limit: this is a fence
      # against logic accreting, and documenting a function should
      # never push it over.
      ignore-comments: true
    gocognit:
      # Reports when complexity is strictly greater than this, so the
      # current worst function sits exactly at the line.
      min-complexity: 110
    gocritic:
      disabled-checks:
        # "ifElseChain" pushes us toward switch statements that aren't
        # always clearer; let the author choose.
        - ifElseChain
        # commentFormatting is noisy for // TODO style markers.
        - commentFormatting
    gosec:
      excludes:
        # G104 (errcheck) is already covered by errcheck linter.
        - G104
        # G306 (WriteFile permissions): we deliberately use 0o644 for
        # scaffolded files so they behave like normal repo files.
        - G306
    goheader:
      # Enforced on every .go file. {{ YEAR-RANGE }} accepts a single
      # year or a range (e.g. "2026" or "2026-2027"); files added in
      # 2026 say "2026" and stale ones can be bumped to "2026-2027" on
      # first edit. Keep in sync with dev/tools/add-license-headers
      # and the LICENSE appendix.
      template: |-
        Copyright {{ YEAR-RANGE }} Google LLC

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.

formatters:
  enable:
    - gofmt          # canonical formatting
    - goimports      # import grouping + missing imports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/go-steer/core-agent

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
