# The A7 run: ONLY the dispatcher's --once Job, rendered with
# `../render.sh --a7-job` and applied after ../base is up and A7 is
# seeded. Kept out of the base so that re-applying the base (an image
# roll, a config change, the 2-week soak) never creates a run that
# claims the oldest queued issue.
#
# It reads the same operator inputs.env as the base (render.sh supplies
# it) only to set the image. The inputs ConfigMap is local-config here:
# the base already applies it, under the same fixed name the Job's
# configMapKeyRefs use.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: core-agent-selfdev

resources:
  - job-dispatcher-a7.yaml

configMapGenerator:
  - name: selfdev-soak-inputs
    envs:
      - inputs.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

replacements:
  - source:
      kind: ConfigMap
      name: selfdev-soak-inputs
      fieldPath: data.SOAK_IMAGE
    targets:
      - select:
          kind: Job
          name: selfdev-soak-dispatcher-a7
        fieldPaths:
          - spec.template.spec.containers.[name=dispatcher].image
