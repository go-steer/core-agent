# The soak's own namespace on the drill cluster (decision 1). Restricted
# Pod Security is enforced: both pods already run non-root with every
# capability dropped, so the label costs nothing and refuses a pod that
# drifts from that.
apiVersion: v1
kind: Namespace
metadata:
  name: core-agent-selfdev
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
