# The daemon's identity. Workload Identity Federation for GKE maps this
# KSA to a principal the operator grants roles/aiplatform.user, and
# nothing else (README.md, "IAM"). There is no iam.gke.io annotation:
# the grant names the KSA's principal directly, with no Google service
# account in between.
#
# No Kubernetes RBAC is bound to it, and its API token is not mounted
# (automountServiceAccountToken: false): the agent's bash runs in this
# pod, and the GKE metadata server serves Workload Identity without
# that token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-agent-selfdev-daemon
  namespace: core-agent-selfdev
automountServiceAccountToken: false
