# The dispatcher's identity. It holds NO Google Cloud role and no
# Kubernetes RBAC: its only credentials are the writer GitHub App's key
# and its own attach token, both Secret files mounted into its pod
# alone. Never grant this KSA anything in IAM.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: selfdev-soak-dispatcher
  namespace: core-agent-selfdev
automountServiceAccountToken: false
