# Persistent volumes. All ReadWriteOnce: the cluster's default storage
# class is a zonal persistent disk. The workspace is mounted by both
# the daemon and the dispatcher (the dispatcher writes each issue's
# working copy there and the agent edits it), which ReadWriteOnce allows
# for pods on the same node; the dispatcher's pod spec requires that
# node with a podAffinity on the daemon.
#
# The eventlog: sessions, gate and approver rows, guardrail trips. It
# is the soak's evidence, so it is never an emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-agent-selfdev-eventlog
  namespace: core-agent-selfdev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# The workspace: per-issue working copies (/workspace/issues) and the
# plans directory the daemon writes and the dispatcher reads
# (/workspace/.soak/plans).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-agent-selfdev-workspace
  namespace: core-agent-selfdev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# The Go module and build cache, and GOPATH for `go install`ed dev
# tools, so `go test` and the presubmits stay warm across issues and
# restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-agent-selfdev-gocache
  namespace: core-agent-selfdev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
# The dispatcher's state file. Mounted by the dispatcher's pod ONLY: it
# records the active issue and the open PRs, and must survive a restart
# (dispatcher design, "Deployment requirements").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: selfdev-soak-dispatcher-state
  namespace: core-agent-selfdev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
