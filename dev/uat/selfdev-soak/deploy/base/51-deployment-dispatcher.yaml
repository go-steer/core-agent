# The dispatcher, polling (the soak's long-running form). It ships at
# replicas: 0. A7 runs the --once Job in 52-job-dispatcher-a7.yaml
# instead; scale this up only for the 2-week soak, and NEVER while that
# Job exists: both mount the one state file, and two dispatchers would
# each claim issues. Scaling back to 0 is the soak's hard stop (design,
# "The dispatcher", step 0).
#
# Its pod spec is the Job's, except for --once and restartPolicy;
# render_test.go fails when the two drift.
#
# The image is the soak image by digest, the same one the daemon runs
# (the Dockerfile builds the dispatcher from the same pinned ref). It
# runs as uid 10001 with the workspace at /workspace, like the daemon:
# the task names the working copy's path, and the agent has to be able
# to write what the dispatcher created (dispatcher design, "Deployment
# requirements").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfdev-soak-dispatcher
  namespace: core-agent-selfdev
  labels:
    app.kubernetes.io/name: core-agent-selfdev
    app.kubernetes.io/component: dispatcher
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: core-agent-selfdev
      app.kubernetes.io/component: dispatcher
      app.kubernetes.io/instance: polling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-agent-selfdev
        app.kubernetes.io/component: dispatcher
        app.kubernetes.io/instance: polling
    spec:
      serviceAccountName: selfdev-soak-dispatcher
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The workspace volume is ReadWriteOnce and the daemon mounts it,
      # so this pod has to land on the daemon's node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: core-agent-selfdev
                  app.kubernetes.io/component: daemon
              topologyKey: kubernetes.io/hostname
      containers:
        - name: dispatcher
          image: REPLACED-BY-KUSTOMIZE-FROM-SOAK_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/selfdev-soak-dispatcher"]
          # Flags per `selfdev-soak-dispatcher --help`. Every secret is a
          # file: the attach token (read with TakeFile, the #1266
          # convention) and the App key (mode-checked). $(VAR) is
          # expanded by the kubelet from env below; an unset one stays
          # literal and fails flag validation, so the pod stops.
          args:
            - "--repo=mastersingh24/core-agent-selfdev"
            - "--maintainer=mastersingh24"
            - "--upstream-repo=go-steer/core-agent"
            - "--attach-url=http://core-agent-selfdev:7777"
            - "--token-file=/var/run/selfdev-soak/attach/token"
            - "--app-id=$(SOAK_APP_ID)"
            - "--app-key-file=/var/run/selfdev-soak/app/private-key.pem"
            - "--worktrees-dir=/workspace/issues"
            # The plans directory the daemon writes (its recipe's
            # .agents/plans is this directory, mounted by subPath).
            - "--agents-dir=/workspace/.soak"
            - "--state-file=/var/lib/selfdev-soak-dispatcher/state.json"
            - "--private-repo=/var/lib/selfdev-soak-dispatcher-repo/mirror.git"
            - "--commit-name=$(SOAK_COMMIT_NAME)"
            - "--commit-email=$(SOAK_COMMIT_EMAIL)"
          env:
            - name: SOAK_APP_ID
              valueFrom:
                configMapKeyRef:
                  name: selfdev-soak-inputs
                  key: SOAK_APP_ID
            - name: SOAK_COMMIT_NAME
              valueFrom:
                configMapKeyRef:
                  name: selfdev-soak-inputs
                  key: SOAK_COMMIT_NAME
            - name: SOAK_COMMIT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: selfdev-soak-inputs
                  key: SOAK_COMMIT_EMAIL
            # The per-push token files go here (dispatcher decision 6),
            # on this pod's own emptyDir.
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # The writer App's private key. Mounted in THIS pod only;
            # the daemon's pod never sees it (decision 7).
            - name: writer-app
              mountPath: /var/run/selfdev-soak/app
              readOnly: true
            # The dispatcher's own attach token: the plaintext whose
            # SHA-256 is the sa:selfdev-dispatcher row of users.json.
            - name: attach-token
              mountPath: /var/run/selfdev-soak/attach
              readOnly: true
            - name: state
              mountPath: /var/lib/selfdev-soak-dispatcher
            - name: private-repo
              mountPath: /var/lib/selfdev-soak-dispatcher-repo
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/soak
      volumes:
        - name: writer-app
          secret:
            secretName: selfdev-soak-writer-app
            defaultMode: 0400
            items:
              - key: private-key.pem
                path: private-key.pem
        - name: attach-token
          secret:
            secretName: selfdev-soak-dispatcher-attach
            defaultMode: 0400
            items:
              - key: token
                path: token
        - name: state
          persistentVolumeClaim:
            claimName: selfdev-soak-dispatcher-state
        # The dispatcher-only bare repository the App token touches
        # (dispatcher decision 5). It can be rebuilt from scratch, so an
        # emptyDir; no other pod can mount it.
        - name: private-repo
          emptyDir:
            sizeLimit: 5Gi
        - name: workspace
          persistentVolumeClaim:
            claimName: core-agent-selfdev-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: home
          emptyDir:
            sizeLimit: 100Mi
