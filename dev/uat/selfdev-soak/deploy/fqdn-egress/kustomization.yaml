# The rig with host-named egress: the parent directory, with its two
# "HTTPS to any public address" policies replaced by GKE
# FQDNNetworkPolicies that name the hosts each pod may reach. This is
# the variant that matches the design ("egress only to Vertex" for the
# daemon, "only GitHub" for the dispatcher).
#
# It needs GKE Dataplane V2 with FQDN network policy enabled
# (`gcloud container clusters update CLUSTER --enable-fqdn-network-policy`).
# On a cluster without it, `kubectl apply` refuses the FQDNNetworkPolicy
# kind, so this variant fails closed rather than deploying unfenced.
#
# Render with `render.sh --fqdn-egress`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - fqdn-networkpolicy.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: core-agent-selfdev-daemon-https
        namespace: core-agent-selfdev
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: selfdev-soak-dispatcher-https
        namespace: core-agent-selfdev
