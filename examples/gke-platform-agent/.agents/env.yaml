# Env manifest (#322). REQUIRED for ${env:VAR} to work at all.
#
# This file is what switches ${env:VAR} interpolation ON. Without it,
# agentenv.LoadManifest returns nil, NewResolver returns a nil *Resolver,
# InterpolateFunc() returns nil, and every loader — instruction files AND
# skills, parent AND rooted subagents — treats nil as "no interpolation" and
# passes the body through untouched.
#
# That failure is SILENT and it is nasty: `${env:GOOGLE_CLOUD_PROJECT}` stays
# in the persona as literal text, the model reads it as the value, and it ends
# up inside an MCP argument —
#   parent: "projects/${env:GOOGLE_CLOUD_PROJECT}/locations/..."
# — which the API rejects. The agent then burns turns hunting for its own
# coordinates (reading /proc/self/environ, stat-ing AGENTS.md, re-reading its
# own persona) to recover values that were supposed to be substituted for it.
# Observed 2026-08-13 in session 019ffc06: 22 turns / 752K tokens / $0.73
# before it was interrupted.
#
# So: any recipe whose AGENTS.md uses ${env:...} must ship this file, and the
# declared set must cover every var referenced anywhere in the content tree —
# including the rooted subagents' own AGENTS.md files, which are loaded with
# the same interpolator.
version: 1
env:
  - name: GOOGLE_CLOUD_PROJECT
    required: true
    description: >-
      GCP project for the Vertex AI (Gemini) client and for every gke MCP
      resource path. The agent's service account has permission here and
      nowhere else, so a wrong or unsubstituted value returns 403.
    used_by:
      - AGENTS.md
      - cluster/AGENTS.md

  # The daemon prints `manifest declares "GOOGLE_CLOUD_LOCATION" but nothing
  # in the bundle references it` at every boot. That is expected, not drift:
  # the drift check (#764) counts `${env:}` references in the content tree and
  # `*_env` config fields, and this var is neither — the Vertex provider reads
  # it straight from the process environment. It is declared here anyway so
  # `required: true` still enforces its presence, which is the whole point:
  # unset, the provider picks a region that may not serve the model.
  - name: GOOGLE_CLOUD_LOCATION
    required: true
    description: >-
      Vertex AI endpoint region ("global"). NOT the cluster's location — see
      GKE_LOCATION. Folding these two together sends gke calls to the wrong
      place and Vertex calls to a region that may not serve the model.
    used_by:
      - deploy/base/kustomization.yaml

  - name: GKE_CLUSTER
    required: true
    description: >-
      The cluster this deployment triages. Matches the "cluster" field in
      lookout watcher payloads and the watcher's --cluster-name.
    used_by:
      - AGENTS.md
      - cluster/AGENTS.md

  - name: GKE_LOCATION
    required: true
    description: >-
      Where the GKE cluster actually lives (e.g. us-central1). Distinct from
      GOOGLE_CLOUD_LOCATION, which is the Vertex endpoint region.
    used_by:
      - AGENTS.md
      - cluster/AGENTS.md

  - name: PLATFORM_AGENT_ALERT_WEBHOOK
    required: false
    sensitive: true
    description: >-
      Webhook URL backing the `alert` tool's oncall target. Optional, but not
      inert: when it is unset the target is dropped at startup, and since
      `oncall` is the only target the `alert` tool is not registered at all
      (the daemon warns on stderr and boots anyway). Set it to give the agent
      an escalation path.
    used_by:
      - .agents/config.hub.json
