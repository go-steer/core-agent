# KSA for the core-agent daemon pod (the Platform Agent). Uses Workload
# Identity Federation for GKE *direct binding* — no Google Service
# Account impersonation for the KSA itself. Bind the following IAM roles
# to this KSA's principal in your project:
#
#   principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/
#     workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/
#     ns/gke-platform-agent/sa/core-agent-daemon
#
# Direct binding is a deliberate choice, and it constrains which Google
# APIs this recipe can talk to. The token the metadata server mints for
# an unannotated KSA is a WIF/STS *federated* token, not an ordinary
# OAuth 2 access token — oauth2.googleapis.com/tokeninfo rejects it with
# "invalid_token". WIF-aware services (container.googleapis.com, Vertex
# AI) accept it; others reject it at the authentication layer with
#
#   401  Request had invalid authentication credentials. Expected OAuth 2
#        access token, login cookie or other valid authentication credential.
#
# That is "invalid", not "insufficient": no IAM role and no OAuth scope
# changes it. If you add an MCP server that 401s this way, the fix is to
# annotate this KSA with iam.gke.io/gcp-service-account and re-grant the
# roles below to that GSA — not to hunt for a missing permission.
# (developerknowledge.googleapis.com is exactly such a service; the
# recipe dropped it rather than move the whole daemon's identity model
# for one documentation-search tool.)
#
# Required roles for the platform-agent use case. This list is prose;
# `../../scripts/grant-iam.sh` is the executable copy of it, and reports
# with --check before it changes anything. Prefer running that to reading
# this and typing six gcloud commands.
#
#   - roles/aiplatform.user       — call Gemini via Vertex AI
#   - roles/mcp.toolUser          — call the read-only `gke` MCP endpoint at
#                                    all (shared by the platform agent and
#                                    the `cluster` subagent)
#   - roles/container.viewer      — read-only GKE state for the `gke` MCP
#                                    (this recipe is plan-first + GitOps-PR:
#                                    the agent proposes changes as pull
#                                    requests, it does not mutate clusters
#                                    directly, so viewer is sufficient for
#                                    the shipped behavior)
#   - roles/iam.serviceAccountUser on the node service account
#                                   (default: <PROJECT_NUMBER>-compute@
#                                    developer.gserviceaccount.com) —
#                                    required by the GKE MCP's server-side
#                                    impersonation chain; missing this
#                                    gives 403 with no clear hint
#   - roles/cloudtrace.user       — export spans to Cloud Trace. Only needed
#                                    on the tracing overlays (example-otel /
#                                    initcontainer-copy-otel), which are the
#                                    default when the cluster has GKE Managed
#                                    OpenTelemetry enabled. Without it the
#                                    daemon runs fine and the OTLP export
#                                    fails quietly in the background — a
#                                    trace-less demo, not a broken one.
#   - roles/monitoring.metricWriter — the metrics half of the same overlay.
#                                    Cloud Trace and Cloud Monitoring are
#                                    separate services and cloudtrace.user
#                                    does not cover metrics, so the shape
#                                    of this omission is: traces arrive,
#                                    metrics silently do not.
#
# If you switch the recipe to a direct-mutation workflow (drop the
# GitOps-PR overlay and let the agent call write tools on the `gke` MCP),
# widen roles/container.viewer to roles/container.admin — but prefer the
# GitOps path and keep this SA least-privilege.
#
# Required APIs — a disabled one fails exactly like a missing role, as a
# 403 from somewhere you were not looking, so grant-iam.sh enables these
# in the same pass:
#   - container.googleapis.com        GKE, and the `gke` MCP surface with it
#   - iamcredentials.googleapis.com   the WIF token exchange; without it
#                                     ADC returns "permission denied" at
#                                     the first runtime call
#   - aiplatform.googleapis.com       Vertex (Gemini path only)
#   - cloudtrace.googleapis.com       the span sink (tracing overlays)
#   - monitoring.googleapis.com       the metric sink (tracing overlays)
#
# telemetry.googleapis.com is the one grant-iam.sh does NOT touch: it
# serves the Instrumentation CRD that GKE Managed OpenTelemetry watches,
# which is a cluster-level opt-in rather than something this workload
# calls. set-up-demo.sh probes for the CRD and picks its overlay from
# whether it is there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-agent-daemon
  namespace: gke-platform-agent
