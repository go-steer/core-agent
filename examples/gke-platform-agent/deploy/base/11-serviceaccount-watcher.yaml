# KSA for the lookout-watch (lookout). Minimum-necessary RBAC —
# see 12-clusterrole-watcher.yaml. NOT bound to any GCP IAM role; the
# watcher only talks to the local k8s API and to the core-agent daemon
# over pod networking (authenticating with a bearer token, not a GCP
# identity).
#
# EXCEPT for tracing, which needs one grant. The tracing overlays set
# OTEL_TRACES_EXPORTER on this Deployment too, and Cloud Trace ingestion
# checks roles/cloudtrace.user on the *calling* identity. Without it the
# watcher exports spans that are rejected server-side — no error in the
# watcher log, just a trace that starts at the daemon and is missing the
# inject that caused it. Grant the same direct WIF binding the daemon
# gets (see 10-serviceaccount-daemon.yaml):
#
#   roles/cloudtrace.user on
#   principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/
#     workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/
#     ns/gke-platform-agent/sa/lookout-watch
#
# set-up-demo.sh checks for this binding on the tracing path and prints
# the command if it is absent. gke-troubleshoot-agent's setup-wif.sh
# binds its own watcher the same way, so this is the house pattern, not
# a special case.
#
# It is still the ONLY GCP role this KSA needs. Everything else the
# watcher does — reading the k8s API, posting to the daemon over pod
# networking with a bearer token — uses no cloud identity, and that
# property is worth preserving when adding anything else here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lookout-watch
  namespace: gke-platform-agent
