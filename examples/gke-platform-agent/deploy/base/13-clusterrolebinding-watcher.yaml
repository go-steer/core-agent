# ClusterRole + Binding names are suffixed with "-gke-platform-agent" so this
# recipe's cluster-scoped objects can coexist with a bare upstream lookout
# install (which uses the plain "lookout-watch" name) in the same cluster
# — cluster-scoped objects share one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lookout-watch-gke-platform-agent
subjects:
  - kind: ServiceAccount
    name: lookout-watch
    namespace: gke-platform-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lookout-watch-gke-platform-agent
