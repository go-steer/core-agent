# Binds the watcher's ServiceAccount (lookout-watch in gke-platform-agent)
# to the kube-system capacity Role (14-role-watcher-capacity.yaml). Only
# needed with --sources=…,capacity. Vendored from go-steer/k8s-lookout
# deploy/15-rolebinding-watcher-capacity.yaml @ v0.22.0 (v0.22.0 added
# only the app.kubernetes.io labels here, which this recipe does not
# carry — see 12-clusterrole-watcher.yaml); changed from
# upstream: metadata.name + roleRef.name (suffixed "-gke-platform-agent" to
# match the Role) and the subject namespace (gke-platform-agent, this recipe's
# namespace, not upstream's agent-triage).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lookout-watch-capacity-gke-platform-agent
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: lookout-watch
    namespace: gke-platform-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lookout-watch-capacity-gke-platform-agent
