# The core-agent daemon Deployment running the kube-agents Platform
# Agent. Long-lived, single-replica, multi-session hub. Accepts inject
# POSTs from the lookout-watch (in this cluster) and attach sessions
# from operators + companions (e.g. a chat gateway).
#
# CONTENT DELIVERY. The recipe's content (config + AGENTS.md + the
# cluster subagent's own root with 6 GKE skills) ships as
# an **OCI image volume** rather than a ConfigMap — a ConfigMap can't
# express the nested directory tree the subagent root needs (no "/" in
# keys) and would hit the 1 MiB ceiling as skills accumulate:
# a FROM-scratch content image mounted read-only at the project root.
# The daemon takes -c pointing into it and discovers everything relative
# to that mount, exactly as on a laptop. See
# docs/agent-content-distribution-design.md and deploy/content.Dockerfile.
#
# Image volumes are beta since k8s 1.33 and available on GKE 1.35+. On
# older clusters use deploy/overlays/initcontainer-copy/, which delivers
# the SAME content image via an initContainer copy instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-agent
  namespace: gke-platform-agent
  labels:
    app.kubernetes.io/name: core-agent
    app.kubernetes.io/component: daemon
  annotations:
    apphub.cloud.google.com/functional-type: "AGENT"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: core-agent
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-agent
        app.kubernetes.io/component: daemon
    spec:
      serviceAccountName: core-agent-daemon
      # Standard clusters only — uncomment to pin onto metadata-server
      # nodes so Workload Identity Federation works. Autopilot REJECTS
      # this selector (metadata server is universal there), so the
      # commented default is Autopilot-safe.
      #
      # nodeSelector:
      #   iam.gke.io/gke-metadata-server-enabled: "true"
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      # No initContainer. The Secret is mounted straight into the daemon.
      #
      # It used to need one: pod-level fsGroup=65532 adds group-read to
      # Secret-volume files, so a Secret at defaultMode=0400 arrives as
      # 0440, and the daemon rejected any group bit at multi-session auth
      # init. Staging it through an emptyDir cost ~20 lines of YAML and,
      # worse, a runAsUser: 0 container in an otherwise non-root pod — a
      # root container whose entire job was one chmod.
      #
      # core-agent#944 accepts 0440 when the file's owning group is one
      # this process belongs to, which is exactly what fsGroup produces
      # (pkg/auth/users_mode.go). Any OTHER group still fails closed. So
      # the Secret mount below is not a relaxation of the check, it is
      # the check learning what fsGroup means.
      containers:
        - name: core-agent
          # Pinned, not :latest. With imagePullPolicy IfNotPresent a node
          # that has cached an older :latest never re-pulls, so the daemon
          # silently runs stale code after a rebuild — the same trap the
          # overlays call out for the content image. Both overlays override
          # this tag; bump all three together.
          image: ghcr.io/go-steer/core-agent:2.9.0
          imagePullPolicy: IfNotPresent
          args:
            # -c points into the content mount. The daemon derives
            # agentsDir = dir(-c) = /opt/gke-platform-agent/.agents and
            # projectRoot = /opt/gke-platform-agent, so the cluster
            # subagent's root ("../cluster") resolves within the mounted
            # tree.
            #
            # config.hub.json carries attach.listen (0.0.0.0:7777) +
            # multi_session (bearer table at /etc/core-agent/users.json),
            # so --no-repl has a listener and the daemon serves the hub.
            #
            # Deliberately FEWER flags than examples/kube-platform-agent:
            # small-tier-parent and the runaway-loop watchdog are declared
            # in config.hub.json (safety.small_tier_parent / safety.watchdog,
            # the latter shipped by core-agent#665), not on the command
            # line. Config is the artifact that travels with the content
            # image; a flag only lives in this manifest, so anyone running
            # the same content locally gets different safety behavior.
            #
            # --session-db is NOT optional here: guardrail trip state
            # (watchdog + cost ceilings) persists via eventlog rows
            # (core-agent#671), so without a session DB a tripped guardrail
            # resets on every restart.
            - "-c"
            - "/opt/gke-platform-agent/.agents/config.hub.json"
            - "--no-repl"
            - "--session-db"
            - "--session-db-path=/var/lib/core-agent/session.db"
          envFrom:
            # GOOGLE_CLOUD_PROJECT + GOOGLE_CLOUD_LOCATION for the Vertex
            # AI client. Generated by the base kustomization; override in
            # your overlay via 'behavior: merge'. Without these the daemon
            # exits at Vertex init with:
            #   core-agent: vertex: project and location are required
            - configMapRef:
                name: core-agent-gcp-env
          ports:
            - name: attach
              containerPort: 7777
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            # The whole recipe directory, read-only, from the OCI image
            # volume. Mounted at /opt/gke-platform-agent (deliberately
            # NOT /etc/core-agent, so the users.json path below stays
            # free of this mount).
            - name: recipe-content
              mountPath: /opt/gke-platform-agent
              readOnly: true
            # Writable subdir nested INSIDE the read-only content mount
            # for record_plan artifacts. record_plan derives plansDir =
            # agentsDir + "/plans" and MkdirAll's it
            # (pkg/tools/record_plan.go); without this the read-only
            # image volume makes that path unwritable and plan-first
            # (permissions.plan_mode: "required") fails. kubelet overlays this
            # emptyDir at the specific /plans path while the rest of the
            # content mount stays read-only — the same nesting technique
            # gke-troubleshoot uses over a ConfigMap projection.
            - name: plans
              mountPath: /opt/gke-platform-agent/.agents/plans
            # users.json bearer table, straight off the Secret. Mounted
            # as a DIRECTORY rather than subPath: a subPath file is
            # projected once and kubelet never refreshes it, so a rotated
            # Secret would not reach this path even across a container
            # restart. The daemon still only reads the table at boot
            # (pkg/auth has no reloader), so rotation means a rolling
            # restart either way — but with the directory mount that is
            # sufficient, and with subPath it is not.
            #
            # /etc/core-agent is a normal kubelet-managed dir here (the
            # content lives under /opt/...), so taking the whole
            # directory collides with nothing.
            - name: users
              mountPath: /etc/core-agent
              readOnly: true
            - name: session-db
              mountPath: /var/lib/core-agent
          readinessProbe:
            # GET /healthz — unauthenticated by construction (core-agent
            # #946; pkg/attach/server.go serves it ahead of auth), 200
            # when every registered subsystem check passes and 503 when
            # one is degraded.
            #
            # This replaces a tcpSocket probe, which passed as soon as
            # :7777 accepted a connection. That is the wrong question: a
            # daemon whose session store has gone unreadable still
            # accepts TCP, so kubelet kept routing inject POSTs at a hub
            # that could not serve them. Requires an image carrying #946
            # — the tag pinned above does, older ones answer 404 and
            # kubelet reads that as not-ready.
            httpGet:
              path: /healthz
              port: attach
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Same endpoint, longer period. Liveness restarts the pod, so
            # it deliberately shares readiness's definition of healthy
            # rather than inventing a weaker one — a subsystem that stays
            # degraded through several readiness failures is a restart
            # candidate, and that is what the 15s/20s spacing encodes.
            httpGet:
              path: /healthz
              port: attach
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        # The recipe directory as an OCI image volume — read-only, no
        # running container, no size limit. Pin by digest in production
        # (see deploy/overlays/example/). Built from deploy/content.Dockerfile.
        - name: recipe-content
          image:
            reference: ghcr.io/go-steer/gke-platform-agent-content:latest
            pullPolicy: IfNotPresent
        # users.json Secret, mounted directly by the daemon. fsGroup
        # 65532 turns defaultMode 0400 into 0440 owned by gid 65532 on
        # disk, which is the shape core-agent#944 accepts. Do not "fix"
        # this to 0600: kubelet applies fsGroup after defaultMode, so the
        # group bit comes back regardless.
        - name: users
          secret:
            secretName: core-agent-users
            defaultMode: 0400
        # Writable scratch for record_plan artifacts (nested at
        # /opt/gke-platform-agent/.agents/plans). Ephemeral — plans are
        # per-session and needn't survive restarts.
        - name: plans
          emptyDir:
            sizeLimit: 10Mi
        - name: session-db
          persistentVolumeClaim:
            claimName: core-agent-session-db
