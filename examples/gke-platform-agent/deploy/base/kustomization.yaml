# Base kustomization. Do NOT apply this directly — it carries
# placeholder coordinates (your-project-id, your-cluster) and no content
# image at all, so the daemon would come up with nothing to read. Copy
# deploy/overlays/example/ to your own overlay, edit the values you care
# about, and `kubectl apply -k` your overlay.
#
# Unlike gke-troubleshoot-agent, there is NO ConfigMap for the .agents/
# tree here: the recipe content (~1.3 MiB) ships as an OCI image volume
# (see 50-deployment-daemon.yaml + deploy/content.Dockerfile). The only
# generated ConfigMap is the small GCP env block below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespacing is done by namespace-transformer.yaml (a builtin
# NamespaceTransformer with unsetOnly: true), NOT the `namespace:`
# shorthand — the shorthand would clobber the capacity Role/RoleBinding
# (14/15), which must stay in kube-system. See that file for the rationale.
transformers:
  - namespace-transformer.yaml

resources:
  - 00-namespace.yaml
  - 10-serviceaccount-daemon.yaml
  - 11-serviceaccount-watcher.yaml
  - 12-clusterrole-watcher.yaml
  - 13-clusterrolebinding-watcher.yaml
  - 14-role-watcher-capacity.yaml
  - 15-rolebinding-watcher-capacity.yaml
  - 16-networkpolicy-watcher.yaml
  - 40-pvc.yaml
  - 50-deployment-daemon.yaml
  - 51-deployment-watcher.yaml
  - 60-service.yaml
  # Secrets (core-agent-users, lookout-watch-token) are created
  # out-of-band per 20-secrets-placeholder.md.

# GCP project + location for the Vertex AI client (Gemini), plus the
# target cluster's identity. Consumed via envFrom on the daemon container.
# The defaults below are PLACEHOLDERS and will not resolve anywhere;
# override them in your overlay via 'behavior: merge':
#
#   configMapGenerator:
#     - name: core-agent-gcp-env
#       behavior: merge
#       literals:
#         - GOOGLE_CLOUD_PROJECT=acme-platform-1234
#         - GKE_CLUSTER=prod-us-central1
#         - GKE_LOCATION=us-central1
#
# GKE_CLUSTER / GKE_LOCATION are NOT the Vertex settings and must not be
# folded into them: GOOGLE_CLOUD_LOCATION is the Gemini endpoint region
# ("global"), while GKE_LOCATION is where the cluster actually lives.
# AGENTS.md interpolates all three via ${env:VAR} so the agent never has
# to discover its own project — without them it opens with a wildcard
# `projects/-/locations/-` call, eats a 403, and then spends turns
# reading its own config tree to work out where it is.
configMapGenerator:
  - name: core-agent-gcp-env
    literals:
      - GOOGLE_CLOUD_PROJECT=your-project-id
      - GOOGLE_CLOUD_LOCATION=global
      - GKE_CLUSTER=your-cluster
      - GKE_LOCATION=us-central1

# Stable ConfigMap name (no content-hash suffix) so overlays reference it
# by name. The recipe README's rollout-restart picks up changes.
generatorOptions:
  disableNameSuffixHash: true
