# Namespaces every resource that does NOT already declare one into
# gke-platform-agent. We use the builtin NamespaceTransformer with
# `unsetOnly: true` INSTEAD of kustomization.yaml's `namespace:` shorthand
# on purpose: the shorthand CLOBBERS every namespaced resource, which would
# rewrite the capacity Role/RoleBinding (14/15) from kube-system to
# gke-platform-agent. Those two must stay in kube-system — that is where the
# cluster-autoscaler-status ConfigMap they grant read access to lives — or
# the watcher's `capacity` source silently 403s. `unsetOnly` fills in
# gke-platform-agent for the resources that leave namespace unset (the SAs, PVC,
# Deployments, Service, and the generated ConfigMap) while preserving every
# explicit namespace (gke-platform-agent on those objects; kube-system on 14/15;
# and the RoleBinding subject namespaces).
apiVersion: builtin
kind: NamespaceTransformer
metadata:
  name: gke-platform-agent-namespace
  namespace: gke-platform-agent
unsetOnly: true
