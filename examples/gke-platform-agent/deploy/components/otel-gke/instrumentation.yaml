# GKE Managed OpenTelemetry auto-configuration CR.
#
# On a cluster with managed OTel enabled, GKE injects the standard OTel
# SDK env vars into every Pod matched by spec.selector:
# OTEL_EXPORTER_OTLP_ENDPOINT (the in-cluster managed collector),
# OTEL_RESOURCE_ATTRIBUTES (with k8s.pod.uid), K8S_POD_UID, sampler
# config, and the metric export interval. Notably NOT injected:
# OTEL_SERVICE_NAME — which is exactly what ../otel sets.
#
# Empty selector = every Pod in this namespace. That is what we want:
# the only Pods in gke-platform-agent are the daemon and the watcher,
# and we want traces from both.
#
# THE NAMESPACE IS SPELLED OUT ON PURPOSE. The base namespaces resources
# with a NamespaceTransformer set to unsetOnly: true (see
# ../../base/namespace-transformer.yaml — the shorthand would clobber
# the kube-system capacity Role/RoleBinding). A component's own
# resources are accumulated at the OVERLAY level, after the base's
# transformers have already run, so nothing would fill this in. Left
# unset, the CR would apply to `default` and instrument nothing.
#
# Tune sampling, resource attributes, or prompt/response capture by
# extending this spec:
# https://docs.cloud.google.com/kubernetes-engine/docs/how-to/managed-otel-gke
apiVersion: telemetry.googleapis.com/v1alpha1
kind: Instrumentation
metadata:
  name: core-agent
  namespace: gke-platform-agent
spec:
  selector: {}
