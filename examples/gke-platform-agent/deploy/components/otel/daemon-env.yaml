# Strategic-merge patch adding the daemon's two OTel env vars.
#
#   - OTEL_TRACES_EXPORTER=otlp — overrides cfg.OTEL.Exporter (default
#     "none") without editing a config file. That matters here more than
#     usual: this recipe's config travels inside the content OCI image,
#     so turning tracing on via config would mean a content rebuild and
#     a CONTENT_TAG bump. As an env var it is a redeploy.
#
#   - OTEL_SERVICE_NAME=core-agent — the Instrumentation CR does not
#     inject this, and without it spans arrive as
#     "unknown_service:core-agent".
#
# Container-list merge is BY NAME, so this reaches the `core-agent`
# container without disturbing the base's args / envFrom / volumeMounts.
# Note the base also has an initContainer (install-users-json); naming
# the container is what keeps this patch off it.
#
# The env LIST itself merges by name too, so these two are added to
# whatever the base declares rather than replacing it. The base daemon
# container currently sets no `env:` at all (only `envFrom:`), so this
# is additive either way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-agent
spec:
  template:
    spec:
      containers:
        - name: core-agent
          env:
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_SERVICE_NAME
              value: "core-agent"
