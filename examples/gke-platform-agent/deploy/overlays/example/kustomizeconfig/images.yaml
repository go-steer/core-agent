# Extend the builtin images transformer to also target OCI image-volume
# references. The default images fieldSpecs only cover
# containers[]/initContainers[]/ephemeralContainers[] `.image`; the image
# volume puts its reference at spec.template.spec.volumes[].image.reference,
# so without this the `images:` block would silently skip the content image.
images:
  - path: spec/template/spec/volumes/image/reference
    kind: Deployment
