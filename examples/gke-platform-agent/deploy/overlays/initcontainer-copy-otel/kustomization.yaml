# The initContainer-copy overlay PLUS OpenTelemetry to GKE Managed OTel.
# set-up-demo.sh picks this when the cluster is below the image-volume
# floor AND has managed OTel enabled.
#
# The OTel axis is orthogonal to the content-delivery axis, which is why
# there are four overlays for two decisions: delivery (image volume vs
# initContainer copy) is forced by the cluster's Kubernetes version,
# tracing is forced by whether managed OTel is on. Both OTel overlays
# compose the same ../../components/otel-gke, so the tracing wiring
# exists once.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../initcontainer-copy

components:
  - ../../components/otel-gke

# No `images:` block — see ../example-otel/kustomization.yaml for why.
# set-up-demo.sh writes the pins into ../initcontainer-copy and they
# flow through this composition; restating them here would silently
# override the operator's prereqs.sh values.
