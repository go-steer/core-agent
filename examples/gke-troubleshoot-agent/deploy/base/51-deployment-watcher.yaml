# The event-watcher sidecar Deployment (`lookout watch` from
# go-steer/k8s-lookout). Watches Kubernetes Events via the local
# kube-apiserver, filters + dedupes, and POSTs matched events to the
# core-agent daemon's session inject endpoint.
#
# Runs as a SEPARATE Deployment from the daemon (not a sidecar
# container in the daemon's pod) so:
#   - operators can scale the two independently
#   - a sidecar restart doesn't restart the daemon (and vice-versa)
#   - additional sidecars in remote clusters follow the same shape
#     (this manifest is the template — copy + change --cluster-name +
#     --daemon-url to add coverage of another cluster)
#
# Talks to the local daemon via the core-agent Service on port 7777.
# For remote clusters, override --daemon-url to
# https://<external-daemon-endpoint>:7777.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-watch
  namespace: agent-triage
  labels:
    app.kubernetes.io/name: lookout-watch
    app.kubernetes.io/component: watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lookout-watch
      app.kubernetes.io/component: watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lookout-watch
        app.kubernetes.io/component: watcher
    spec:
      serviceAccountName: lookout-watch
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: watcher
          # Source lives in go-steer/k8s-lookout; the image ENTRYPOINT
          # is `lookout watch`. A `-gke` image flavor and a richer
          # `--sources=` capability set are available there; this
          # recipe deliberately stays on the event-driven-triage
          # baseline and points at the rest rather than adopting it.
          # The `--sources` pin below is what holds the rest back —
          # NOT the ClusterRole's verbs; see the comment on that arg
          # and the header of 12-clusterrole-watcher.yaml.
          #
          # FLOOR v0.17.0, not just a "latest is nice" pin: that
          # release retired the `k8s-event-watcher` transition naming
          # every resource in this directory used to carry. Pinning
          # back below it resurrects the old Kubernetes resource
          # names, the `k8s-event-watcher-token` Secret key, and the
          # `k8s_event_watcher_*` metric prefix — none of which these
          # manifests, the users.json identity, or the e2e's metric
          # assertion speak any more.
          image: ghcr.io/go-steer/lookout:v0.21.0
          imagePullPolicy: IfNotPresent
          args:
            - "--daemon-url=http://core-agent.agent-triage.svc.cluster.local:7777"
            - "--token-env=WATCHER_TOKEN"
            - "--mode=per-incident"
            - "--owner=sre-oncall@example.com"
            - "--cluster-name=local"
            # THIS PIN IS THE GUARD. lookout constructs only the
            # sources named in the set; an unnamed source is never
            # built and reads nothing, whatever RBAC allows. That is
            # what makes 12-clusterrole-watcher.yaml's posture safe —
            # do not read it the other way round, because several of
            # lookout's sources (expiry, saturation) declare list-only
            # requirements and would not be blocked by verbs alone.
            #
            # Its one behavioral effect today is dropping `ingress`,
            # which rides the same events grant and needs no rule of
            # its own, so `--sources=auto` would resolve to
            # `k8s-events,ingress` here. Dropping it is right: the
            # k8s-triage skill ships no ingress reference, and ingress
            # events in the stream would make the recipe's e2e
            # non-deterministic. There is no fail-fast argument for
            # the pin, though — a `k8s-events` miss is fatal under
            # `auto` too, by upstream design.
            - "--sources=k8s-events"
            # Likewise: `--storm=auto` already resolves off, since the
            # topology graph needs pods/nodes/replicasets list+watch.
            # Stated so the intent survives a future RBAC change.
            - "--storm=off"
            # Declare the one enrichment list the ClusterRole withholds
            # (Secrets — see 12's header) instead of letting each
            # incident discover it through a LIST the API server
            # rejects with 403. `--enrich-lists-preflight` is
            # deliberately NOT set: it exists to drop known-denied
            # lists via SelfSubjectAccessReview, and subtracting the
            # only denied list here leaves it nothing to find.
            - "--enrich-lists=all,-secrets"
            - "--dedup-window=5m"
            - "--in-cluster"
            - "--metrics-addr=:9090"
            - "--log-level=info"
          env:
            - name: WATCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lookout-watch-token
                  key: token
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
