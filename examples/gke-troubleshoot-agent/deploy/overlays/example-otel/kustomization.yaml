# Example overlay + OpenTelemetry to GKE Managed OTel. Same shape as
# ../example, plus:
#
#   1. components/otel — turns the daemon's exporter on (one env var).
#   2. instrumentation.yaml — the GKE Managed OpenTelemetry CR that
#      auto-injects OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_SERVICE_NAME /
#      OTEL_RESOURCE_ATTRIBUTES into every Pod in the namespace.
#
# Spans land in Cloud Trace with no self-managed collector to run.
# See README.md for GKE cluster prereqs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Compose the plain example overlay as-is (base + watcher cluster
# name patch + agents ConfigMap) so this overlay stays a superset,
# not a fork. Also compose the Instrumentation CR — kustomize
# doesn't have a dedicated CR slot, so it goes in `resources:`
# alongside the composed overlay.
resources:
  - ../example
  - instrumentation.yaml

# The one-env-var component. See components/otel/README.md — the
# endpoint / service / resource attrs come from the CR above, not
# this component.
components:
  - ../../components/otel

# Pin the composed example's daemon image to 2.9.0-dev.1 — the same
# floor ../example carries, and for the same reason: the recipe's
# config.json uses `alerts` and `tools.wait_and_verify`, which the
# 2.8.0 GA daemon silently drops rather than rejects (see the long
# note in ../example/kustomization.yaml, and #680). It also carries
# everything the OTel path needs: the OTEL_TRACES_EXPORTER env
# override (PR #315, first shipped in v2.7.0-dev.4), the OTel
# span-duplication and Cloud Trace resource fixes from #333–#340, and
# v2.8.0's full metrics pipeline + Go runtime instrumentation
# (#325/#338).
#
# The pin is restated here rather than inherited so this overlay stays
# correct on its own terms if ../example's moves. Both must satisfy the
# floor; TestOverlayPinsSatisfyRecipeConfig checks each overlay
# independently and resolves through `resources:`, so a restated pin
# and an inherited one are both caught.
#
# The watcher (ghcr.io/go-steer/lookout, from go-steer/k8s-lookout) is
# pinned to the same tag as the composed example overlay. Two floors
# stack: v0.11.0+ is required against daemons ≥ 2.8.0-dev.1
# (Content-Type on the bodyless POST /sessions; #383), and v0.17.0+ is
# required by the base manifests' `lookout-watch` resource names, which
# that release introduced when it retired the `k8s-event-watcher`
# transition naming. v0.21.0 also fixes OTLP export building no
# exporter at all when no endpoint env var is set — directly relevant
# to this overlay, which relies on the Instrumentation CR to inject
# OTEL_EXPORTER_OTLP_ENDPOINT.
images:
  - name: ghcr.io/go-steer/core-agent
    newTag: "2.9.0-dev.1"
  - name: ghcr.io/go-steer/lookout
    newTag: "v0.21.0"
