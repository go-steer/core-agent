# .agents/env.yaml — env-var manifest for the kube-platform-agent recipe.
#
# Declares the environment variables the runtime overlay (AGENTS.md)
# interpolates via ${env:VAR}. The daemon validates these at boot
# (pkg/agentenv): a missing required var is fail-loud, so a placeholder or
# hallucinated project can never leak into the system prompt.
#
# GOOGLE_CLOUD_PROJECT reaches the container via the daemon Deployment's
# envFrom -> core-agent-gcp-env ConfigMap (deploy/base/50-deployment-daemon.yaml;
# set per-cluster in each overlay's configMapGenerator). It doubles as the
# Vertex project, so it is always present when the daemon boots.
#
# NOTE: GOOGLE_CLOUD_LOCATION in that ConfigMap is the *Vertex* endpoint
# (often "global"), NOT a GKE cluster location — it is deliberately not used
# to address clusters. This is a fleet agent: cluster locations are resolved
# per-incident from the gke MCP, not pinned in env (contrast the single-cluster
# gke-troubleshoot-agent recipe, which fixes GKE_CLUSTER/GKE_LOCATION).
#
# See docs/concepts/env-manifest.md for the full schema.
version: 1
env:
  - name: GOOGLE_CLOUD_PROJECT
    required: true
    description: GCP project ID the fleet lives in (must match the daemon KSA's WIF binding project); also the Vertex project.
    used_by: [AGENTS.md]
