# KSA for the core-agent daemon pod (the Platform Agent). Uses Workload
# Identity Federation for GKE *direct binding* — no Google Service
# Account impersonation for the KSA itself. Bind the following IAM roles
# to this KSA's principal in your project:
#
#   principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/
#     workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/
#     ns/kube-platform/sa/core-agent-daemon
#
# Required roles for the platform-agent use case:
#   - roles/aiplatform.user       — call Gemini via Vertex AI
#   - roles/mcp.toolUser          — call any GKE MCP tool at all (covers
#                                    both mcp.json endpoints: the single
#                                    read-only `gke` — shared by the platform
#                                    agent and the `cluster` subagent — and
#                                    `developer_knowledge`)
#   - roles/container.viewer      — read-only GKE state for the `gke` MCP
#                                    (excluding Secrets: `roles/container.viewer`
#                                    carries zero `container.secrets.*`
#                                    permissions, so the agent cannot read
#                                    Secret values or list Secret names, and no
#                                    predefined read-only GKE role grants
#                                    secrets access — `roles/container.developer`
#                                    also grants `create`/`delete`/`update`.
#                                    This recipe leaves Secrets unreadable and
#                                    treats a 403 on a confirming Secret read as
#                                    expected when an Event + workload manifest
#                                    already name the missing reference, #695)
#   - roles/iam.serviceAccountUser on the node service account
#                                   (default: <PROJECT_NUMBER>-compute@
#                                    developer.gserviceaccount.com) —
#                                    required by the GKE MCP's server-side
#                                    impersonation chain; missing this
#                                    gives 403 with no clear hint
#
# If a deployment needs the daemon to read Secrets in one namespace, bind a
# namespace-scoped Kubernetes Role (`get`/`list` on `secrets`, which exposes
# Secret data as well as names) to the Workload Identity User
# `serviceAccount:<PROJECT_ID>.svc.id.goog[kube-platform/core-agent-daemon]`
# rather than widening project IAM to `roles/container.developer`. If you
# switch the recipe to a direct-mutation workflow (drop the
# GitOps-PR overlay and let the agent call write tools on the `gke` MCP),
# widen roles/container.viewer to roles/container.admin — but prefer the
# GitOps path and keep this SA least-privilege.
#
# Required API: iamcredentials.googleapis.com must be enabled for the
# WIF token-exchange path to work; without it ADC returns "permission
# denied" at the first runtime call.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-agent-daemon
  namespace: kube-platform
