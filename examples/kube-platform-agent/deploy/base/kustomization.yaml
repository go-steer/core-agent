# Base kustomization. Do NOT apply this directly — it uses defaults
# (ghcr.io/go-steer/*:latest, example.com identities) you'd want to
# override. Copy deploy/overlays/example/ to your own overlay, edit the
# values you care about, and `kubectl apply -k` your overlay.
#
# Unlike gke-troubleshoot-agent, there is NO ConfigMap for the .agents/
# tree here: the recipe content (~1.3 MiB) ships as an OCI image volume
# (see 50-deployment-daemon.yaml + deploy/content.Dockerfile). The only
# generated ConfigMap is the small GCP env block below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default namespace for all namespaced resources, including the generated
# ConfigMap. Cluster-scoped resources (ClusterRole, ClusterRoleBinding)
# ignore this field.
namespace: kube-platform

resources:
  - 00-namespace.yaml
  - 10-serviceaccount-daemon.yaml
  - 11-serviceaccount-watcher.yaml
  - 12-clusterrole-watcher.yaml
  - 13-clusterrolebinding-watcher.yaml
  - 40-pvc.yaml
  - 50-deployment-daemon.yaml
  - 51-deployment-watcher.yaml
  - 60-service.yaml
  # Secrets (core-agent-users, k8s-event-watcher-token) are created
  # out-of-band per 20-secrets-placeholder.md.

# GCP project + location for the Vertex AI client (Gemini). Consumed via
# envFrom on the daemon container. Defaults target the go-steer demo
# project; override in your overlay via 'behavior: merge':
#
#   configMapGenerator:
#     - name: core-agent-gcp-env
#       behavior: merge
#       literals:
#         - GOOGLE_CLOUD_PROJECT=my-real-project
#         - GOOGLE_CLOUD_LOCATION=us-central1
configMapGenerator:
  - name: core-agent-gcp-env
    literals:
      - GOOGLE_CLOUD_PROJECT=gke-demos-345619
      - GOOGLE_CLOUD_LOCATION=global

# Stable ConfigMap name (no content-hash suffix) so overlays reference it
# by name. The recipe README's rollout-restart picks up changes.
generatorOptions:
  disableNameSuffixHash: true
