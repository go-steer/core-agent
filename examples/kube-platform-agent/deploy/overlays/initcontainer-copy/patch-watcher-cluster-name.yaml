# Set --cluster-name so every inject payload's "cluster" field identifies
# the source cluster. Change "my-cluster" to your real cluster name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-watch
  namespace: kube-platform
spec:
  template:
    spec:
      containers:
        - name: watcher
          args:
            - "--daemon-url=http://core-agent.kube-platform.svc.cluster.local:7777"
            - "--token-env=WATCHER_TOKEN"
            - "--mode=per-incident"
            - "--owner=platform-oncall@example.com"
            - "--cluster-name=my-cluster"
            - "--dedup-window=5m"
            - "--in-cluster"
            - "--metrics-addr=:9090"
            - "--log-level=info"
