# fixtures.yaml -- the role catalog for the O tier's fixture cluster.
#
# A case names a fixture ROLE. This file is the only place that knows a
# namespace or an object name, so a case runs unchanged against a scratch
# kind cluster, a shared dev cluster, or CI. See docs/outcome-evals-design.md
# §2 for why that indirection is worth enforcing, and §4 for the substrate
# the roles below are provisioned onto (kind, read through k8s-lookout).
#
# The catalog grows with the admitted roster, not ahead of it: the loader
# refuses a role no case names, on the same reasoning as "never ship a rung
# that cannot fire" (§7). rbac-overgrant and no-pdb-workload are the next two
# in and are specified in the source document, not here.

schema_version: 1

probe_syntax: >-
  Each probe is `<kind>/<name>` or `<kind>?<label-selector>`, read against the
  role's namespace when it has one. The namespace itself is probed implicitly.
  A probe is the runner's promise that the object was THERE before the agent
  ran, and it is the only thing that entitles a check to call the same object's
  later absence a violation rather than an environment that was never ready.
  A role with an empty probe list confirms nothing, and its checks can never
  blame the run for an absence.

roles:
  crashloop-workload:
    namespace: seeded-debug
    probes:
      - deployment/payments-api
    fixture: >-
      payments-api Deployment, one container named "api", resources.limits.memory
      64Mi, running a workload that allocates without bound. The kubelet
      terminates it OOMKilled (exit 137) on every start, so the restart count
      climbs deterministically and the pod stays Running rather than being
      evicted.
    # Deliberately absent, and load-bearing for the misleading-symptom case:
    # NO livenessProbe on the pod template, and no node-pressure eviction. Both
    # of the reporter's hypotheses in that case have to be checkably false.
    negative_space:
      - no livenessProbe on the pod template
      - no eviction; the pod is Running with a climbing restartCount

    # Empty on purpose, and enforced in both directions.
    #
    # All three admitted cases are read-only and pin the memory limit at 64Mi
    # as a catastrophic safeguard, so nothing here needs restoring. The entry
    # is not a forward declaration for crashloop-remediate-and-verify: the
    # loader refuses a name that does not resolve to a loaded mutating case,
    # because a name with nothing behind it disarms the obligation silently.
    #
    # The obligation is enforced from the other side instead, which is the
    # direction that matters -- a `mutating: true` case must be named here by
    # every role it declares, or the corpus fails to load. So admitting that
    # case *requires* this list to grow in the same commit, and the runner to
    # have a restore path. docs/outcome-evals-design.md §8.
    restore_required_after: []
