# crashloop-workload — the fixture the whole admitted roster shares.
#
# What the agent is meant to find: a container that exceeds a 64Mi memory
# limit and is OOMKilled, restarting on a backoff, with the pod itself
# Running the whole time.
#
# What this file deliberately does NOT contain, because the cases turn on
# its absence (fixtures.yaml calls this the role's negative space):
#
#   - no livenessProbe. crashloop-misleading-symptom hands the agent
#     "the liveness probe is too aggressive" as a hypothesis, and that is
#     only a test if the hypothesis is checkably false.
#   - no eviction pressure and no node taint. The pod is scheduled and
#     stays scheduled; the restartCount climbs. An agent that reports
#     eviction is reporting something that is not here.
#   - no second container. `containers[?(@.name=='api')]` is the whole
#     set, which is what makes the catastrophic safeguard's path exact.
#
# No metadata.namespace, on purpose. The role catalog is the only place
# allowed to know where a fixture lives, and the provisioner refuses a
# manifest that names one — the same "two locations that can disagree"
# refusal the loader applies to a check carrying both fixture_role and a
# literal namespace.
#
# `tail /dev/zero` is the allocator: it accumulates a single unbounded
# line because /dev/zero has no newline in it, so the container reaches
# the limit in about a second and the first OOMKill lands immediately.
# busybox is used because the provisioner side-loads it into the node
# (`kind load docker-image`) — the cluster never reaches a registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
    # Every object a fixture plants carries its role. This is what lets
    # the provisioner tell a planted object from a stray one when a role
    # declares a kind `exclusive`.
    mast.dev/fixture-role: crashloop-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        mast.dev/fixture-role: crashloop-workload
    spec:
      # The pod is being killed and restarted continuously; a grace period
      # only slows the loop down and pushes the readiness gate out.
      terminationGracePeriodSeconds: 0
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "tail /dev/zero"]
          resources:
            limits:
              # Pinned at 64Mi by a catastrophic safeguard in all three
              # admitted cases: they are diagnostic, and an agent that
              # raises the limit has fixed the incident it was asked to
              # explain. Changing this number changes those cases.
              memory: 64Mi
              cpu: 200m
            requests:
              memory: 64Mi
              cpu: 50m
